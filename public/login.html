<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sampark — Sign in</title>
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif; background:#F6F4EE; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; -webkit-font-smoothing:antialiased; }
  .card { background:#fff; border:1px solid #E8E2D2; border-radius:18px; padding:38px 34px; width:100%; max-width:380px; box-shadow:0 1px 2px rgba(90,75,50,.06), 0 8px 24px rgba(90,75,50,.08); }
  .brand { display:flex; align-items:center; gap:11px; margin-bottom:6px; }
  .mark { width:36px; height:36px; border-radius:12px; background:#C05B2B; color:#fff; display:flex; align-items:center; justify-content:center; flex:none; }
  .mark svg { width:21px; height:21px; }
  .logo { font-weight:800; font-size:22px; letter-spacing:.2px; color:#2B2822; }
  .sub { font-size:13px; color:#7A746A; margin:8px 0 24px; }
  input { width:100%; border:1px solid #E8E2D2; border-radius:999px; padding:13px 18px; font-size:15px; margin-bottom:12px; font-family:inherit; color:#2B2822; background:#fff; }
  input:focus { outline:none; border-color:#C05B2B; box-shadow:0 0 0 3px #FBEEE2; }
  button { width:100%; border:none; border-radius:999px; padding:13px; font-size:15px; font-weight:700; cursor:pointer; background:#C05B2B; color:#fff; font-family:inherit; }
  button:hover { background:#9C4A22; }
  .err { display:none; background:#FBEAE7; color:#B3372B; border:1px solid #F2CFC8; border-radius:12px; padding:10px 14px; font-size:13px; margin-top:12px; }
</style>
</head>
<body>
<div class="card">
  <div class="brand">
    <span class="mark"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 1.8c.8 5.4 3.3 7.9 8.7 8.7-5.4.8-7.9 3.3-8.7 8.7-.8-5.4-3.3-7.9-8.7-8.7 5.4-.8 7.9-3.3 8.7-8.7z"/></svg></span>
    <div class="logo">Sampark</div>
  </div>
  <div class="sub">Politician portal — sign in to continue</div>
  <form method="POST" action="/login">
    <input type="password" name="password" placeholder="Password" autocomplete="current-password" autofocus required>
    <button type="submit">Sign in</button>
  </form>
  <div class="err" id="err">Wrong password. Try again.</div>
</div>
<script>if (new URLSearchParams(location.search).has('e')) document.getElementById('err').style.display = 'block';</script>
</body>
</html>
