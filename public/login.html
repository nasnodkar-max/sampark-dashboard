<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sampark — Sign in</title>
<style>
  :root { --indigo:#232a5c; --amber:#f59e0b; --bg:#f4f5fa; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; background:var(--bg); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
  .card { background:#fff; border-radius:14px; padding:36px 34px; width:100%; max-width:380px; box-shadow:0 4px 18px rgba(35,42,92,.12); }
  .logo { font-weight:800; font-size:24px; letter-spacing:.5px; color:var(--indigo); }
  .logo span { color:var(--amber); }
  .sub { font-size:13px; color:#6b7280; margin:6px 0 22px; }
  input { width:100%; border:1px solid #d1d5db; border-radius:8px; padding:12px 14px; font-size:15px; margin-bottom:12px; font-family:inherit; }
  input:focus { outline:none; border-color:var(--indigo); box-shadow:0 0 0 3px rgba(35,42,92,.12); }
  button { width:100%; border:none; border-radius:8px; padding:12px; font-size:15px; font-weight:700; cursor:pointer; background:var(--indigo); color:#fff; }
  button:hover { background:#1b2149; }
  .err { display:none; background:#fef2f2; color:#991b1b; border:1px solid #fecaca; border-radius:8px; padding:10px 12px; font-size:13px; margin-top:12px; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">SAMPARK <span>·</span></div>
  <div class="sub">Politician portal — sign in to continue</div>
  <form method="POST" action="/login">
    <input type="password" name="password" placeholder="Password" autocomplete="current-password" autofocus required>
    <button type="submit">Sign in</button>
  </form>
  <div class="err" id="err">Wrong password. Try again.</div>
</div>
<script>if (new URLSearchParams(location.search).has('e')) document.getElementById('err').style.display = 'block';</script>
</body>
</html>
