# Render Blueprint — one-click deploy of the Sampark dashboard.
# In Render: New → Blueprint → point at the repo containing this file.
services:
  - type: web
    name: sampark-dashboard
    runtime: node
    plan: starter
    disk:
      name: sampark-data
      mountPath: /var/sampark-data
      sizeGB: 1
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    # Persistent disk ($7/mo Starter): the SQLite DB lives at
    # /var/sampark-data/sampark.db and survives restarts and redeploys.
    envVars:
      - key: DB_PATH
        value: /var/sampark-data/sampark.db
      - key: REP_NAME
        value: Arjun Deshpande
      - key: CONSTITUENCY
        value: Margao
      - key: LLM_PROVIDER
        value: anthropic
      - key: ANTHROPIC_MODEL
        value: claude-haiku-4-5-20251001
      # Secrets — set these in the Render dashboard after deploy:
      # WEBHOOK_VERIFY_TOKEN, WHATSAPP_TOKEN, WHATSAPP_PHONE_NUMBER_ID,
      # WHATSAPP_APP_SECRET, ANTHROPIC_API_KEY / OPENAI_API_KEY, DASHBOARD_PASSWORD
      - key: WEBHOOK_VERIFY_TOKEN
        sync: false
      - key: DASHBOARD_PASSWORD
        sync: false
